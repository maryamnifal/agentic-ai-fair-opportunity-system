
# Agentic AI-Based Fair Opportunity and Capability Verification System
#
# Pipeline: Agent A -> Agent B -> Agent C -> Agent D
#
#   portfolio-evidence-agent (A)  : NLP/LLM evidence extraction from portfolio material
#   skill-verification-agent (B) : claim-evidence consistency checking
#   job-compatibility-agent (C)  : IR/embeddings-based job matching
#   fair-ranking-agent (D)       : fairness re-ranking, auth, rate limiting, UI
#
# Only fair-ranking-agent is exposed as the entry point a user interacts with
# (its /demo page and /api/full-pipeline). The other three are reachable
# directly too (useful for testing each agent in isolation), but the intended
# flow is: open http://localhost:8003/demo and let Agent D orchestrate A/B/C.

services:
  portfolio-evidence-agent:
    build: ./agents/portfolio_evidence_agent
    container_name: portfolio-evidence-agent
    ports:
      - "8000:8000"
    restart: unless-stopped

  skill-verification-agent:
    build: ./agents/skill_verification_agent
    container_name: skill-verification-agent
    ports:
      - "8001:8000"
    restart: unless-stopped

  job-compatibility-agent:
    build: ./agents/job_compatibility_agent
    container_name: job-compatibility-agent
    ports:
      - "8002:8000"
    restart: unless-stopped

  fair-ranking-agent:
    build: ./agents/fair-ranking-agent
    container_name: fair-ranking-agent
    ports:
      - "8003:8000"
    environment:
      PORTFOLIO_EVIDENCE_URL: "http://portfolio-evidence-agent:8000"
      SKILL_VERIFICATION_URL: "http://skill-verification-agent:8000"
      JOB_COMPATIBILITY_URL: "http://job-compatibility-agent:8000"
      UPSTREAM_TIMEOUT_SECONDS: "120"
      # Change this for any real deployment -- the code falls back to an
      # insecure dev default if unset, which is fine for local demo only.
      JWT_SECRET_KEY: "change-me-in-production"
    depends_on:
      - portfolio-evidence-agent
      - skill-verification-agent
      - job-compatibility-agent
    volumes:
      - fair_ranking_data:/app/data
    restart: unless-stopped

volumes:
  fair_ranking_data:
